[project]
name = "video-editing-workbench"
version = "0.1.0"
description = "可复现的素材检查、剪辑方案验证和开源引擎运行工作台"
requires-python = ">=3.11,<3.15"
dependencies = ["pydantic>=2.11,<3", "pillow>=11,<13", "vedit-mcp==0.1.0"]

[project.optional-dependencies]
# video-cli comes from the user's existing video-2022 checkout via uv --with.
delivery = ["truststore>=0.10,<1"]
server = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "oss2>=2.19.1",
    "pymongo>=4.18.1",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
editing = "video_editing.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editing"]

[tool.uv]
link-mode = "hardlink"

[tool.uv.sources]
vedit-mcp = { git = "https://github.com/metiu1/editorvideo-ai.git", rev = "2d1247887ad1f4461ba01b92a8afc2209fdd212e" }

[dependency-groups]
dev = [
    "mongomock>=4.3.0",
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["integration: 调用真实 FFmpeg 和开源引擎"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
