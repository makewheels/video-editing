name: 检查与真实渲染

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.12'
      - name: 安装系统媒体工具和中文字体
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: uv sync --locked --extra server
      - run: uv run ruff check --no-cache .
      - run: uv run editing doctor
      - run: uv run pytest
